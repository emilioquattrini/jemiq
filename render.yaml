# Hosting di prova: un servizio Node, senza database o disco aggiuntivi.
# Le credenziali si compilano nel pannello Render alla prima creazione.
services:
  - type: web
    name: jemiq
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/emilioquattrini/jemiq
    branch: codex/jemiq-product
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev --no-fund --no-audit && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24.x"
      - key: HOST
        value: "0.0.0.0"
      - key: TRUST_PROXY
        value: "1"
      - key: APP_ORIGIN
        fromService:
          type: web
          name: jemiq
          envVarKey: RENDER_EXTERNAL_URL
      - key: GEMINI_API_KEY
        sync: false
      - key: JEMIQ_ACCESS_TOKEN
        sync: false
